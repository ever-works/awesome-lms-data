copyright_year: 2026
name: Awesome LMS
initial_prompt: |-
  A curated directory of learning-management systems and online-course platforms, corporate and open source. Include products such as Moodle, Canvas LMS, TalentLMS, Docebo, Thinkific, Teachable, LearnDash, Open edX, Absorb LMS, 360Learning, Chamilo, iSpring Learn, plus other notable commercial and open-source options. Categories: Corporate LMS, Course Platforms for Creators, Open-Source LMS, LMS for Schools & Universities, Learning Experience Platforms, Authoring Tools. For every item capture the official website, a short factual description, pricing model (free, freemium, paid, open source), deployment (cloud or self-hosted), key features and integrations.

  Initial categories: Corporate LMS; Course Platforms for Creators; Open-Source LMS; LMS for Schools & Universities; Learning Experience Platforms; Authoring Tools.
  Target keywords: learning management system, lms software, open source lms, online course platform.

  Start with these source lists (use the raw README link for GitHub lists):
  - https://en.wikipedia.org/wiki/List_of_learning_management_systems
  - https://www.softwaresuggest.com/corporate-lms-software
  - https://www.softwaresuggest.com/e-learning-software
  - https://www.saashub.com/best-online-courses-software
  - https://openalternative.co/categories/content-publishing/learning-management-systems-lms
  - https://awesome-selfhosted.net/tags/learning-and-courses.html
  - https://github.com/topics/lms

  Inclusion rules: every item is a real product, service, open-source project or platform in scope; never a statistic, quote, blog post, person or general concept.
  One item per product. The item URL is the official website (never an affiliate link, review-site page or "top 10" article). Skip discontinued products and sites that no longer resolve.
  Descriptions: 2-4 factual sentences, no hype; state the pricing model; for open source state the license and link the repository.
  Each item gets exactly one primary category from the initial categories; do not create near-duplicate categories.
  Tags where they apply: Open Source, Self-Hosted, Free Plan, Freemium, Paid, Enterprise, API, AI-Powered, plus niche-specific ones.
  Never use G2, Capterra, GetApp, TrustRadius, AlternativeTo, Product Hunt, SourceForge/Slashdot, There's An AI For That or Toolify as sources.
website_repo: ever-works/awesome-lms-website
