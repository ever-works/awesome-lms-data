markdown: >-
  ## Overview


  Claroline is an open-source learning management system (LMS) and course
  management system written in PHP.


  ## Features


  - Open-source under the GNU General Public License (GPL)

  - Written in PHP

  - Course creation and management

  - Collaborative learning tools

  - Self-hosted deployment

  - Document sharing

  - Calendar and agenda management


  ## Pricing


  Free and open-source under the GPL license. Self-hosted with no licensing
  fees.
