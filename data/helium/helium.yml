markdown: >-
  ## Overview


  Helium is an open-source color-coded student planner for managing classes,
  homework, grades, and notes, with smart notifications and multi-device
  synchronization.


  ## Features


  - Color-coded student planner

  - Classes, homework, grades, and notes tracking

  - Smart notifications

  - Multi-device sync

  - Self-hosted deployment

  - Web-based interface


  ## Deployment


  Self-hosted (Docker)


  ## License


  MIT


  ## Technology


  Python, Docker
