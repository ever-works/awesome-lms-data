name: Edmingle
description: Edmingle is an AI-driven, analytics-centric training management
  platform designed for training organizations to build, manage, and scale
  training businesses. It supports live classes, attendance tracking, API
  integration, e-commerce, SMS notifications, course management, SCORM
  compliance, and user permissions. It is tailored for startups, SMBs,
  mid-market, and enterprises with paid plans starting at $83 per month.
