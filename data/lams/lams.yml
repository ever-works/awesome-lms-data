markdown: >-
  ## Overview


  LAMS (Learning Activity Management System) is an open-source learning design
  tool that enables educators to create, manage, and deliver sequences of
  collaborative online learning activities.


  ## Features


  - Open-source under the GNU General Public License (GPL)

  - Visual learning design interface

  - Activity sequencing and branching

  - Collaborative learning tools

  - Content repository

  - Learner tracking and monitoring

  - Self-hosted deployment

  - Integration with other LMS platforms via LTI

  - Multilingual support


  ## Pricing


  Free and open-source under the GPL license. Self-hosted with no licensing
  fees.


  ## Repository


  Source code available from the LAMS Foundation.
