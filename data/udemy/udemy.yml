markdown: >-
  ## Overview


  Udemy is an online learning platform that enables instructors to create and
  sell courses on a wide range of topics, while learners can purchase courses
  for lifetime access.


  ## Features


  - Over 210,000 courses across business, technology, design, and personal
  development

  - Courses taught by independent instructors

  - Lifetime access to purchased courses

  - Mobile and TV apps for learning on the go

  - Certificate of completion for paid courses

  - Free courses available


  ## Pricing


  Courses are priced individually, typically ranging from free to several
  hundred dollars. Udemy frequently offers discounts. Instructors receive a
  revenue share based on how the student was acquired.


  ## Deployment


  Cloud-hosted (SaaS).
