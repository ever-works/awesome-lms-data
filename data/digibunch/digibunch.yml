  ## Overview


  Digibunch is an open-source link-sharing tool designed for educators to create
  collections of links to share with learners or colleagues.


  ## Features


  - Create bunches of links to share with learners or colleagues

  - Self-hosted deployment

  - Web-based interface


  ## Deployment


  Self-hosted


