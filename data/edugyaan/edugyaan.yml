description: EduGyaan is a ready-to-use white-label online tutoring software
  that enables coaching institutes and tutors to take offline classes online
  within minutes. It provides built-in features for live classes, recordings,
  test series, virtual classrooms, student management, homework management,
  gamification, and mobile access. Pricing is paid (details available on request
  from the vendor); it is deployed as a cloud/SaaS platform.
