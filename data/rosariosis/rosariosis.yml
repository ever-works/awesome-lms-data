markdown: |-
  ## Overview

  RosarioSIS is an open-source Student Information System for school management.

  ## Features

  - Student demographics management
  - Grades tracking
  - Scheduling
  - Attendance tracking
  - Student billing
  - Discipline management
  - Food service modules
  - Self-hosted deployment
  - Web-based interface

  ## Deployment

  Self-hosted

  ## License

  GPL-2.0

  ## Technology

  PHP
