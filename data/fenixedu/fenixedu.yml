markdown: >-
  ## Overview


  FenixEdu is an open-source academic management system (AMS) and learning
  management system developed collaboratively by Portuguese universities,
  including Instituto Superior Técnico and Universidade de Aveiro.


  ## Features


  - Open-source under the Apache License 2.0

  - Student information system (SIS) capabilities

  - Course and curriculum management

  - Enrollment and registration

  - Grade management

  - Academic calendar

  - Self-hosted deployment

  - Modular architecture

  - Multi-institution support


  ## Pricing


  Free and open-source under Apache License 2.0. Self-hosted deployment with no
  licensing fees.


  ## Repository


  Source code available on GitHub at github.com/FenixEdu
