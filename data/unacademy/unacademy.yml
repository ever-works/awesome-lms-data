markdown: >-
  ## Overview


  Unacademy is a learning platform providing live classes, recorded lectures,
  quizzes, and study notes across competitive exam subjects. It is designed for
  learners ranging from individuals to enterprise customers.


  ## Features


  - Offline Access

  - Interactive Quizzes

  - Leaderboards

  - Multiple Educators

  - Structured Courses

  - Live Polls

  - Interactive Whiteboard

  - Customizable Study Plans


  ## Pricing


  - Free: $0 per month

  - Plus: $6 per month

  - Iconic: $11 per month


  ## Target Segments


  - StartUps

  - SMBs

  - Mid-Market

  - Enterprises
