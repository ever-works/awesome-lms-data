markdown: >-
  ## Overview


  Skilljar is a customer education LMS that transforms learning into an
  engaging, personalized experience. With seamless integrations and flexible
  monetization options, Skilljar accelerates onboarding and boosts retention,
  ensuring customers see product value quickly.


  ## Features


  - Seamless integrations

  - Flexible monetization options

  - Customer onboarding

  - Personalized learning experiences


  ## Deployment


  Cloud-based (SaaS)


  ## Pricing Model


  Paid — starting price available upon request; no free plan publicly listed.


  ## Target Audience


  Startups, SMBs, Mid-Market, Enterprises
