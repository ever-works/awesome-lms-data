markdown: >-
  ## Overview


  Murf AI is a DIY AI voice-over tool that converts scripts or home-style voice
  recordings into studio-quality audio for videos, presentations, or
  text-to-speech requirements.


  ## Features


  - Voice Modulation

  - User Interface

  - API Integration

  - Voice Editing

  - Voice Cloning

  - Voice Customization

  - Voice Over Integration

  - Voice Effects


  ## Pricing


  - Free: $0 per month

  - Creator: $29 per month

  - Business: $99 per month


  ## Target Segments


  Startups, SMBs, Mid-Market, Enterprises
