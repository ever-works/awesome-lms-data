markdown: >-
  ## Overview


  Codecademy is an interactive online learning platform focused on teaching
  programming and technical skills through a learn-by-doing approach.


  ## Features


  - Interactive coding lessons in the browser

  - Courses in web development, data science, computer science, and IT

  - Beginner-friendly learning paths

  - Skill paths and career paths

  - Projects and quizzes

  - Certificates of completion


  ## Pricing


  Free tier includes basic courses. Pro subscription unlocks advanced content,
  projects, certificates, and career paths.


  ## Deployment


  Cloud-hosted (SaaS).
