markdown: >-
  ## Overview


  WeBWorK is an open-source online homework delivery system for mathematics and
  science courses. It allows instructors to create and assign problems, provides
  students with instant feedback, and automatically grades submissions.


  ## Features


  - Open-source under the GNU General Public License (GPL)

  - Algorithmically generated problems with randomization

  - Instant feedback for students

  - Automatic grading

  - Gradebook management

  - Problem libraries for calculus, algebra, statistics, physics, and more

  - Custom problem authoring

  - Self-hosted deployment

  - Integration with other LMS platforms


  ## Pricing


  Free and open-source under the GPL license. Self-hosted with no licensing
  fees.


  ## Repository


  Source code available on GitHub at github.com/openwebwork/webwork
