markdown: >-
  ## Overview


  eFront is an enterprise learning management system (LMS) developed by
  Epignosis LLC, designed for corporate training and e-learning deployment.


  ## Features


  - Course creation and management

  - User and group management

  - Advanced reporting and analytics

  - E-commerce integration for selling courses

  - White-label customization

  - SCORM and xAPI (Tin Can) support

  - Mobile learning support

  - API and integrations with third-party systems


  ## Pricing


  Commercial/paid licensing. Pricing varies based on deployment model (cloud or
  self-hosted) and number of users. Contact vendor for pricing details.


  ## Deployment


  Available as cloud-hosted SaaS or self-hosted on-premise deployment.
