  ## Features


  - Gamification

  - API Integration

  - Discussion Forums

  - Blended Learning

  - SCORM Compliance

  - E Commerce

  - Reporting And Analytics

  - Course Management


  ## Target Segments


  - StartUps

  - SMBs

  - Mid-Market

  - Enterprises


  ## Deployment


  Mobile-first platform suitable for corporate and eLearning environments.
