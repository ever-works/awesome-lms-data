markdown: >-
  ## Overview


  e-khool LMS is an AI-powered learning management system designed for corporate
  training, education, and skill development. It offers a comprehensive platform
  for course delivery, learner management, and analytics.


  ## Features


  - AI-powered learning recommendations

  - Course authoring and management

  - Assessments and certifications

  - Gamification and badges

  - Mobile learning app

  - Analytics and reporting

  - SCORM and xAPI support

  - Integration with HRIS and third-party tools

  - White-label customization

  - Cloud-hosted deployment


  ## Pricing


  Commercial/paid product. Pricing varies by organization size and feature
  requirements. Contact vendor for pricing.
