markdown: >-
  ## Overview


  Kannu is a cloud-based learning management system (LMS) developed by Kadenze,
  Inc. It enables institutions and educators to create and deliver online
  courses with a focus on media-rich and creative education.


  ## Features


  - Course creation and management

  - Media-rich content support (video, audio, images)

  - Student enrollment and management

  - Assignment and grading tools

  - Discussion forums

  - Mobile-responsive interface

  - Analytics and insights

  - Cloud-hosted deployment

  - Branding and customization options


  ## Pricing


  Commercial/paid product. Pricing varies by institution and usage. Contact
  vendor for pricing details.
