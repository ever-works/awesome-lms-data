markdown: >-
  ## Overview


  Lessonly is learning and training management software designed for capturing
  and sharing team knowledge, improving skills with feedback, and driving
  greater productivity. It serves startups, SMBs, mid-market, and enterprises.


  ## Features


  - Single Sign On (SSO)

  - Learning Paths

  - Surveys & Feedback

  - Knowledge Base

  - Reporting And Analytics

  - Role Based Permissions

  - SCORM Compliance

  - API Access


  ## Pricing


  - Free: $0/month (billed annually)

  - Basic: $200/month (billed annually)

  - Plus: $500/month (billed annually)

  - Growth: $1,000/month (billed annually)
