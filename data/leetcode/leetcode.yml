markdown: >-
  ## Overview


  LeetCode is an online platform for practicing coding problems and preparing
  for technical interviews.


  ## Features


  - Comprehensive problem library across algorithms, data structures, and
  databases

  - Company-specific interview questions

  - Active community and discussion forums

  - Mock interviews and contests

  - Skill progression tracking


  ## Pricing


  Free tier with basic problem access. Premium subscription unlocks additional
  problems, company tags, and interview simulations.


  ## Deployment


  Cloud-hosted (SaaS).
