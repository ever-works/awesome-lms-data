markdown: >-
  ## Overview


  LON-CAPA (Learning Online Network with Computer-Assisted Personalized
  Approach) is an open-source course management system and content sharing
  network primarily used in higher education STEM disciplines.


  ## Features


  - Open-source under the GNU General Public License (GPL)

  - Course management and delivery

  - Personalized assessment with algorithmically generated questions

  - Content sharing across institutions

  - Dropbox for assignments

  - Gradebook and student tracking

  - Discussion forums

  - Self-hosted deployment

  - Supports math and science content


  ## Pricing


  Free and open-source under the GPL license. Self-hosted with no licensing
  fees.


  ## Repository


  Source code available on GitHub.
