markdown: >-
  ## Overview


  INGInious is an open-source intelligent grader for secured and automated
  testing of code written by students.


  ## Features


  - Intelligent grader for student code

  - Secured and automated testing

  - Supports multiple programming languages

  - Self-hosted deployment

  - Web-based interface


  ## Deployment


  Self-hosted (Docker)


  ## License


  AGPL-3.0


  ## Technology


  Python, Docker
