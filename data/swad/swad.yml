markdown: >-
  ## Overview


  SWAD (Secreto Web para el Aprendizaje de Documentos) is an open-source
  learning management system developed at the University of Granada in Spain for
  university-level teaching and learning.


  ## Features


  - Open-source under the GNU General Public License (GPL)

  - Course and subject management

  - Document and file sharing

  - Communication tools (forums, announcements)

  - Assessment and grade management

  - Student tracking

  - Self-hosted deployment

  - Spanish and multilingual support


  ## Pricing


  Free and open-source under the GPL license. Self-hosted with no licensing
  fees.


  ## Repository


  Source code available from the University of Granada.
