markdown: >-
  ## Overview


  Exercism is a free, open-source platform for practicing programming skills
  through coding exercises and mentorship.


  ## Features


  - Practice problems in over 30 programming languages

  - Mentorship from experienced developers

  - Wide variety of languages

  - Structured learning tracks

  - Free of cost

  - Open source codebase


  ## Pricing


  Completely free.


  ## License


  Open source. Repository: https://github.com/exercism


  ## Deployment


  Cloud-hosted (SaaS).
