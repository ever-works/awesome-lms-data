markdown: >-
  ## Overview


  edX is a global MOOC platform created by Harvard and MIT, offering courses,
  MicroBachelors, MicroMasters, professional certificates, and full online
  degrees from leading universities and institutions.


  ## Features


  - Courses from Harvard, MIT, Berkeley, and other top institutions

  - Verified certificates for a fee

  - MicroBachelors and MicroMasters programs

  - Full online degrees

  - Audit most courses for free

  - Open edX open-source platform available for self-hosting


  ## Pricing


  Many courses can be audited free of charge. Verified certificates typically
  range from $50 to $300. Professional certificates and full degrees cost more.


  ## Deployment


  Cloud-hosted (SaaS); open-source Open edX available for self-hosted
  deployment.
