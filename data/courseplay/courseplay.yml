markdown: >-
  ## Overview


  Courseplay is a next-generation learning experience platform (LXP) designed
  for 360-degree employee growth. It combines on-the-job, social, and formal
  learning in a single workplace platform.


  ## Features


  - User Management

  - Mobile Compatibility

  - Role Based Access

  - Discussion Forums

  - SCORM Compliance

  - Custom Branding

  - Reporting And Analytics

  - Course Creation


  ## Target Segments


  - StartUps

  - SMBs

  - Mid-Market

  - Enterprises


  ## Pricing


  - Free Trial: $0 for 30 Days

  - Small 100 Plan: $109 per month for 100 Active Users


  ## User Ratings


  - Features: 4.5

  - Ease of Use: 4.0

  - Value for Money: 4.5

  - Customer Support: 4.5

  - Rating Score: 8.0 / 10


  Users describe Courseplay as budget-friendly, user-friendly, and feature-rich,
  with responsive customer support. Some users note occasional stability issues
  and bugs that are resolved over time.
