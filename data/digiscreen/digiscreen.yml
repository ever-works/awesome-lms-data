markdown: >-
  ## Overview


  Digiscreen is an open-source interactive whiteboard and wallpaper for the
  classroom, designed for in-person or remote teaching.


  ## Features


  - Interactive whiteboard/wallpaper for classroom use

  - Supports in-person and remote teaching

  - Self-hosted deployment

  - Web-based interface


  ## Deployment


  Self-hosted


  ## License


  AGPL-3.0


  ## Technology


  Node.js, PHP
