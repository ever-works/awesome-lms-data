markdown: >-
  ## Overview


  Duolingo is a language-learning platform that makes learning a new language
  fun through gamified, bite-sized lessons.


  ## Features


  - Gamified language lessons

  - Points, streaks, and leveling system

  - Variety of languages

  - Free tier with ads

  - Super Duolingo paid subscription (ad-free, offline access)

  - Mobile and web applications


  ## Pricing


  Free tier available. Super Duolingo subscription removes ads and adds offline
  access.


  ## Deployment


  Cloud-hosted (SaaS) with mobile and web apps.
