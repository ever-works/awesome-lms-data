name: TestInvite
description: TestInvite is online assessment and exam software that enables
  users to design exams, generate detailed reports, and securely conduct tests
  with anti-cheating measures including lockdown mode, webcam/screen recording,
  live proctoring, and chat monitoring. It is tailored for StartUps, SMBs,
  Mid-Market, and Enterprises. Pricing tiers are Starter at $900/year, Essential
  at $1900/year, Advanced at $2900/year, and Pro at $3900/year.
