markdown: >-
  ## Overview


  TestInvite is a secure online assessment platform for creating and
  administering exams with proctoring and anti-cheating capabilities. It serves
  businesses of various sizes from startups to enterprises.


  ## Features


  - Language Support

  - Candidate Authentication

  - Integration With Lms

  - Detailed Analytics

  - Instant Feedback

  - Timed Assessments

  - Automated Grading

  - Customizable Templates

  - Lockdown mode

  - Webcam/screen recording

  - Live proctoring

  - Chat monitoring


  ## Pricing


  - Starter: $900 per year

  - Essential: $1900 per year

  - Advanced: $2900 per year

  - Pro: $3900 per year


  ## Target Segments


  - StartUps

  - SMBs

  - Mid-Market

  - Enterprises
