markdown: >-
  ## Overview


  Growth Engineering is a UK-based learning technology company that provides
  learning management systems (LMS) and learning experience platforms (LXP) with
  a focus on gamification, social learning, and learner engagement.


  ## Features


  - Gamification (badges, points, leaderboards)

  - Social learning feeds

  - Learning paths and campaigns

  - Mobile app (OttoLearn)

  - Content authoring tools

  - Analytics and reporting

  - SCORM and xAPI compliance

  - Integration capabilities

  - White-label customization

  - Cloud-hosted deployment


  ## Pricing


  Commercial/paid product. Pricing varies by organization size and feature
  requirements. Contact vendor for quotes.
