markdown: >-
  ## Overview


  Pocket Study is a new age LMS (Learning Management System) with an advanced
  mobile app and interesting new models for effective teaching-learning
  activities. It is a centralized tool for sharing content in the most organized
  way.


  ## Features


  - Single Sign On (SSO)

  - Role Based Access

  - Content Library

  - Discussion Forums

  - Mobile Access

  - Customizable Interface

  - Assessment Tools

  - Progress Tracking


