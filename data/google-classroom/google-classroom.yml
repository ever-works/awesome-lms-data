markdown: >-
  ## Overview


  Google Classroom is a free web service developed by Google for schools that
  aims to simplify creating, distributing, and grading assignments in a
  paperless way. It is part of Google Workspace for Education.


  ## Features


  - Free for educational institutions

  - Assignment creation and distribution

  - Grading and feedback tools

  - Integration with Google Workspace (Docs, Drive, Meet, etc.)

  - Class stream for announcements

  - Student work tracking

  - Guardian email summaries

  - Mobile apps for iOS and Android

  - Originality reports

  - Rubrics

  - Cloud-hosted deployment


  ## Pricing


  Free for schools using Google Workspace for Education. Paid editions
  (Education Plus, Teaching and Learning Upgrade) available with additional
  features.
