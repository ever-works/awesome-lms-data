markdown: >-
  ## Overview


  Pluralsight is a learning management system and technology skills platform
  designed for aspiring and established technology professionals.


  ## Features


  - Comprehensive course library covering software development, IT operations,
  data, security, and cloud

  - Skill assessments and role IQ measurements

  - Expert instructors

  - Offline access to course content

  - Learning paths and skill development plans

  - Enterprise analytics and team management


  ## Pricing


  Subscription-based pricing for individuals and enterprises. Plans vary by
  features and team size.


  ## Deployment


  Cloud-hosted (SaaS).
