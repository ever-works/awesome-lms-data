markdown: >-
  ## Overview


  MapleLMS is a modern-day learning management system with out-of-the-box
  Salesforce integration. This highly scalable and AI-powered LMS delivers live
  and on-demand continuing learning and is easy to manage for non-technical
  users.


  ## Features


  - Mobile Learning

  - Learning Paths

  - E Commerce

  - Certification Management

  - Automated Notifications

  - Content Library

  - Blended Learning

  - Social Learning


  ## Pricing


  Starting price information was listed on the vendor page but no specific
  amount was visible. Contact vendor for pricing details.


  ## Deployment


  Cloud-based (SaaS)
