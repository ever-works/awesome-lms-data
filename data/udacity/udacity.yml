markdown: >-
  ## Overview


  Udacity is an online learning platform focused on career-relevant technical
  education through Nanodegree programs and individual courses.


  ## Features


  - Nanodegree programs in deep learning, machine learning, web development,
  data science, and more

  - Industry-relevant curriculum developed with company partners

  - Hands-on projects

  - Mentorship and support

  - Flexible, self-paced learning

  - Career services and resume reviews


  ## Pricing


  Nanodegree programs are paid subscriptions. Some free courses are available.


  ## Deployment


  Cloud-hosted (SaaS).
