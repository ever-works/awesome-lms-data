markdown: >-
  ## Overview


  Cornerstone OnDemand is a cloud-based human capital management (HCM) and
  learning management system (LMS) platform for enterprises. It combines
  learning management with talent management, performance, and recruitment
  capabilities.


  ## Features


  - Learning management and course delivery

  - Content management and curation

  - Performance management

  - Recruitment and onboarding

  - HR and workforce analytics

  - Compliance training

  - Mobile learning

  - AI-powered recommendations

  - API and integrations

  - Enterprise-grade security and scalability

  - Cloud-hosted deployment


  ## Pricing


  Commercial/paid enterprise product. Pricing is customized based on
  organization size and modules selected. Contact vendor for quotes.
