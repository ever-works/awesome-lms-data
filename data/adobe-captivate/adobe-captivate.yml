markdown: >-
  ## Overview


  Adobe Captivate is an eLearning authoring tool that enables users to create
  various kinds of interactive and fully responsive e-learning content,
  including software demonstrations, branching scenarios, virtual tours,
  simulations, and more.


  ## Features


  - Advanced Actions

  - Fluid Boxes

  - Text To Speech

  - HTML5 Publishing

  - Branching Scenarios

  - Closed Captioning

  - VR Capabilities

  - Themes And Templates


  ## Pricing


  - Perpetual Licence: $1,299 one-time
