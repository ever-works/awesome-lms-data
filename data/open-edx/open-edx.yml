markdown: >-
  ## Overview


  Open edX is an open-source learning management system (LMS) platform
  originally developed by edX, a nonprofit organization founded by Harvard
  University and MIT. It powers the edx.org MOOC platform and is used by
  academic institutions, corporations, and governments worldwide.


  ## Features


  - Open-source under the GNU Affero General Public License v3 (AGPLv3)

  - Course authoring with Studio

  - Learner portal and course discovery

  - XBlock extensibility architecture

  - Mobile app support

  - Discussion forums and peer assessments

  - Certificate generation

  - Analytics and insights

  - Self-hosted deployment

  - Multi-language support


  ## Pricing


  Free and open-source under AGPLv3. Self-hosted deployment with no licensing
  fees. Managed hosting and support services available from Open edX partners.


  ## Repository


  Source code hosted on GitHub at github.com/openedx
