markdown: >-
  ## Overview


  Edsby is a cloud-based learning management system (LMS) and data platform
  purpose-built for K-12 school districts. It connects teachers, students,
  parents, and administrators in a unified system.


  ## Features


  - Gradebook and assessment management

  - Attendance tracking

  - Parent portal and engagement tools

  - Student information system (SIS) integration

  - Course and class management

  - Persistent groups and communities

  - Analytics and reporting for administrators

  - Mobile apps for iOS and Android

  - Timetable and scheduling integration

  - Cloud-hosted deployment


  ## Pricing


  Commercial/paid product. Pricing is based on district size and student count.
  Contact vendor for quotes.
