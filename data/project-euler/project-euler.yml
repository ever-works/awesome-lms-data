markdown: >-
  ## Overview


  Project Euler is a collection of challenging mathematical and computer
  programming problems that require more than just mathematical insights to
  solve.


  ## Features


  - Challenging mathematical and programming problems

  - Problem-solving skills development

  - Programming practice across multiple languages

  - Mathematical insight and algorithm design

  - Community of problem solvers


  ## Pricing


  Completely free.


  ## License


  Open source.


  ## Deployment


  Cloud-hosted (SaaS).
