markdown: >-
  ## Overview


  Spongelab is a game-based learning platform and learning management system
  focused on science education for K-12 and higher education. It combines
  interactive educational games, simulations, and content with LMS
  functionality.


  ## Features


  - Game-based learning content (science focus)

  - Interactive simulations and videos

  - Class and student management

  - Assessment and progress tracking

  - Content authoring tools

  - Badges and achievements

  - Lesson planning tools

  - Cloud-hosted deployment


  ## Pricing


  Freemium model. Free tier available with basic features. Paid plans for
  advanced features and institutional use.
