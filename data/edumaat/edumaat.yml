markdown: >-
  ## Overview


  EDUMAAT is an enhanced ERP that automates the education sector, starting from
  student admission to graduation. An educational institute is a place where the
  management, the students, the parents, and the faculty are identified as
  stakeholders.


  ## Deployment & Pricing


  - **Deployment:** Cloud

  - **Pricing:** Free plan available. EDUMAAT Basic in Cloud and EDUMAAT
  Advanced in Cloud are both listed at $0 per student per month.


  ## Features


  - Communication Tools

  - Admissions Management

  - Teacher Portal

  - Attendance Management

  - Event Management

  - Transport Management

  - Hostel Management

  - Gradebook


  ## User Sentiment


  Customers praise EDUMAAT for its user-friendly interface, wide feature set,
  strong customization, modular design, and responsive customer support that
  speeds implementation and automation. Recurring negatives include IP/session
  errors, occasional QR/barcode challenges, and some difficulty with bulk Excel
  uploads.
